name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - name: Prepare assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/kelime-oyunu-${GITHUB_REF_NAME}-debug.apk"
          if ls apk/kelime-oyunu-${GITHUB_REF_NAME}-release.apk >/dev/null 2>&1; then
            cp apk/kelime-oyunu-${GITHUB_REF_NAME}-release.apk dist/
          fi
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
